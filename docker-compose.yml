services:
  postgres:
    image: postgres:16
    container_name: url-shortener-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener_user -d shortener"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: url-shortener-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      bd_url: ${BD_URL}
      bd_username: ${BD_USERNAME}
      bd_password: ${BD_PASSWORD}
      bd_driver: ${BD_DRIVER}
    ports:
      - "8080:8080"
